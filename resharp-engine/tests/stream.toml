description = '''
earliest matches for streaming
'''

[[test]]
name = "endanch"
pattern = "$"
input = "\n"
matches = [[0, 0],[1, 1]]


[[test]]
name = "basic_ab"
pattern = "ab"
input = "abxxabab"
matches = [[0, 2], [4, 6], [6, 8]]

[[test]]
name = "basic_digits_shortest"
pattern = '\d+'
input = "a12b3"
matches = [[1, 2], [2, 3], [4, 5]]

[[test]]
name = "branch_overtake_start"
pattern = 'aab|cb'
input = "acb"
matches = [[1, 3]]
vs_find_all = true

[[test]]
name = "begin_anchor_caret_match"
pattern = '^foo'
input = "foo"
matches = [[0, 3]]
vs_find_all = true

[[test]]
name = "begin_anchor_caret_no_match_xfoo"
pattern = '^foo'
input = "xfoo"
matches = []
vs_find_all = true

[[test]]
name = "begin_anchor_A_no_match_xfoo"
pattern = '\Afoo'
input = "xfoo"
matches = []
vs_find_all = true

[[test]]
name = "begin_anchor_lb_A_no_match_xfoo"
pattern = '(?<=\A)foo'
input = "xfoo"
matches = []
vs_find_all = true

[[test]]
name = "empty_input_nullable"
pattern = 'a*'
input = ""
matches = [[0, 0]]

[[test]]
name = "empty_input_non_nullable"
pattern = 'a+'
input = ""
matches = []

[[test]]
name = "begin_anchor_empty_input"
pattern = '^foo'
input = ""
matches = []
vs_find_all = true

[[test]]
name = "begin_anchor_only_at_start"
pattern = '^foo'
input = "fooXfoo"
matches = [[0, 3]]
vs_find_all = true

[[test]]
name = "begin_anchor_no_begin_match_body_rejected"
pattern = '^foo'
input = "xfoofoo"
matches = []
vs_find_all = true

[[test]]
name = "lookaround_match_span"
pattern = '(?-u)(?<=<row Id=")\d+(?=")'
input = '  <row Id="42" Foo="bar"/>  <row Id="99" />'
matches = [[11, 13], [37, 39]]
vs_find_all = true

[[test]]
name = "begin_anchored_union_arm_wins_leftmost_start"
pattern = '\Acb|b'
input = "cb"
matches = [[0, 2]]
vs_find_all = true

[[test]]
name = "optional_begin_anchored_prefix_wins_leftmost_start"
pattern = '(?:\Ac)?b'
input = "cb"
matches = [[0, 2]]
vs_find_all = true

[[test]]
name = "begin_anchored_or_empty_prefix_wins_leftmost_start"
pattern = '(?:\Ac|)b'
input = "cb"
matches = [[0, 2]]
vs_find_all = true

[[test]]
name = "lookahead_effect_at_end_keeps_empty_match_at_start"
pattern = '(?:(?!cc)|b)'
input = "c"
matches = [[0, 0], [1, 1]]
vs_find_all = true

[[test]]
name = "lookahead_effect_at_end_literal_or_neg_lookahead"
pattern = '(?:a|(?!ca))'
input = "c"
matches = [[0, 0], [1, 1]]
vs_find_all = true

[[test]]
name = "lookahead_effect_at_end_neg_lookahead_or_end_anchor"
pattern = '(?:(?!ab)|\z)'
input = "a"
matches = [[0, 0], [1, 1]]
vs_find_all = true

[[test]]
name = "lookahead_effect_at_end_keeps_empty_matches_mid_input"
pattern = '(?:(?!cc)|b)'
input = "ac"
matches = [[0, 0], [1, 1], [2, 2]]
vs_find_all = true
