input = "aaa"
matches = [[0, 3]]
groups = [[[2, 3]]]

[[test]]
name = "capture_empty_group_spans"
pattern = "(?P<x>a*)"
input = ""
matches = [[0, 0]]
groups = [[[0, 0]]]

[[test]]
name = "capture_before_lookahead"
pattern = "(?P<x>foo)(?=bar)"
input = "foobar"
matches = [[0, 3]]
groups = [[[0, 3]]]

[[test]]
name = "capture_trailing_lookahead_gates_group_close_across_many_matches"
