[[test]]
name = "repeated_literal_z_double"
pattern = 'a+z[^\s]\S+'
input = "aazzaa"
matches = [[0, 6]]
javascript = true

[[test]]
name = "repeated_literal_z_single"
pattern = 'a+z[^\s]\S+'
