[[test]]
name = "key_value_alternation"
pattern = '[a-z]+=(?:"(?:[^"\\]|\\.)+"|[^"]\S+)'
input = "s==name))"
matches = [[0, 9]]
javascript = true

[[test]]
name = "shared_wrap_literal_short_alternation_branch"
