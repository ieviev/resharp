input = "__bbaaaa__"
matches = [[2, 4]]

[[test]]
name = "lookahead_bb_aaaaa"
pattern = "bb(?=aaaaa)"
input = "__bbaaaaa__"
matches = [[2, 4]]

[[test]]
name = "lookahead_word_springer"
