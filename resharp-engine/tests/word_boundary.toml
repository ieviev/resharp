description = '''
word boundary tests, cross-validated against the regex crate.
'''

[[test]]
name = "basic_boundary"
pattern = '(and|AND)\b(.*)'
input = "xxxxxANDyyyyy"
vs_regex = true

[[test]]
name = "basic_boundary"
pattern = '(and|AND)\b(.*)'
input = "xxxxxANDyyyyy"
vs_regex = true

[[test]]
