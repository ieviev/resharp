[package]
name = "resharp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "high-performance regex engine with intersection and complement operations"
keywords = ["regex", "automata", "intersection", "complement"]
categories = ["text-processing"]
documentation = "https://docs.rs/resharp"
readme = "../README.md"

[lib]
doctest = false

[features]
default = ["unicode-props"]
unicode-props = ["resharp-parser/unicode-props"]
unicode-case = ["resharp-parser/unicode-case"]
unicode-gencat = ["resharp-parser/unicode-gencat"]
unicode-script = ["resharp-parser/unicode-script"]
unicode-bool = ["resharp-parser/unicode-bool"]
unicode-age = ["resharp-parser/unicode-age"]
unicode-segment = ["resharp-parser/unicode-segment"]
# experimental, off by default: zero-width / anchored patterns can report phantom
# matches (see TODO.md). do not enable in production.
stream = []
debug = ["resharp-algebra/debug"]
diag = []
wide_state = []
precompile-tests = []
# disabled till certain it wont cause blowup
convergence_prefix = []
# unstable public API: Regex::captures_all / Captures / capture_names
experimental_capture_groups = []
# unstable public API: RegexSet / TaggedMatch
regex_set = []
serialize = ["dep:serde", "dep:bincode", "resharp-algebra/serialize"]
pcre2-bench = ["dep:pcre2"]

[dependencies]
resharp-algebra.workspace = true
resharp-parser = { path = "../resharp-parser", version = "0.8.1", default-features = false }
rustc-hash = "2"
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1", optional = true }
pcre2 = { version = "0.2", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
resharp = { path = ".", default-features = false, features = ["diag", "experimental_capture_groups", "regex_set"] }
resharp-algebra.workspace = true
regex-syntax = { version = "0.8.5", default-features = false, features = ["unicode-perl"] }
toml = "0.8"
regex = "1"
fancy-regex = "0.14"
regex-automata = "0.4.14"
aho-corasick = "1"
serde_json = "1"
memmap2 = "0.9"
schemars = "0.8"

# rayon doesn't compile on wasi
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "captures"
harness = false
required-features = ["experimental_capture_groups"]

[[bench]]
name = "ismatch"
harness = false

[[bench]]
name = "experiments"
harness = false


